services:
  fixture-sync:
    build: .
    container_name: football-fixture-sync
    restart: unless-stopped
    environment:
      # Comma-separated list of FA Full-Time fixture URLs to poll
      - FIXTURE_URLS=${FIXTURE_URLS}
      # Comma-separated list of Google Calendar IDs (one per fixture URL, in same order)
      - CALENDAR_IDS=${CALENDAR_IDS}
      # Path to service account credentials (inside container)
      - SERVICE_ACCOUNT_FILE=/app/service_account.json
      # How often to poll for fixture updates (in hours)
      - POLL_INTERVAL_HOURS=${POLL_INTERVAL_HOURS:-12}
      # Timezone for calendar events
      - TZ=${TZ:-Europe/London}
      # Team name translations (Full Name:Short,Full Name 2:Short 2)
      - TEAM_NAMES=${TEAM_NAMES:-}
      # Data directory for persistence
      - DATA_DIR=/app/data
    volumes:
      # Mount your Google Cloud service account credentials (read-only)
      - ./service_account.json:/app/service_account.json:ro
      # Persist synced fixture data across container restarts
      - ./data:/app/data
