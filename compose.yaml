services:
  fixture-sync:
    build: .
    container_name: football-fixture-sync
    restart: unless-stopped
    environment:
      # Comma-separated list of FA Full-Time fixture URLs to poll
      - FIXTURE_URLS=${FIXTURE_URLS}
      # Comma-separated list of Google Calendar IDs (one per fixture URL, in same order)
      - CALENDAR_IDS=${CALENDAR_IDS:-}
      # Path to service account credentials (inside container)
      - SERVICE_ACCOUNT_FILE=/app/service_account.json
      # How often to poll for fixture updates (in hours)
      - POLL_INTERVAL_HOURS=${POLL_INTERVAL_HOURS:-12}
      # Timezone for calendar events
      - TZ=${TZ:-Europe/London}
      # Team name translations (Full Name:Short,Full Name 2:Short 2)
      - TEAM_NAMES=${TEAM_NAMES:-}
      # Kit colours for Spond (Full Name:home:away) — hex or names; opponent colour omitted
      - TEAM_COLOURS=${TEAM_COLOURS:-}
      # Email notifications (optional - leave blank to disable)
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - EMAIL_FROM=${EMAIL_FROM:-}
      - EMAIL_TO=${EMAIL_TO:-}
      - EMAIL_TO_ADMIN=${EMAIL_TO_ADMIN:-}
      # Optional dead-man's switch (Healthchecks.io ping URL). Pinged after every poll.
      - HEALTHCHECKS_PING_URL=${HEALTHCHECKS_PING_URL:-}
      # Spond integration (optional - leave blank to disable)
      - SPOND_EMAIL=${SPOND_EMAIL:-}
      - SPOND_PASSWORD=${SPOND_PASSWORD:-}
      - SPOND_GROUP_IDS=${SPOND_GROUP_IDS:-}
      - SPOND_HOST_IDS=${SPOND_HOST_IDS:-}
      # Google Maps API key for Spond pins (Geocoding + Places APIs)
      # Get a key at: https://console.cloud.google.com/google/maps-apis/credentials
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY:-}
      # Dry run mode - test without creating events (true/false)
      - DRY_RUN=${DRY_RUN:-false}
      # Data directory for persistence
      - DATA_DIR=/app/data
    volumes:
      # Mount your Google Cloud service account credentials (read-only)
      - ./service_account.json:/app/service_account.json:ro
      # Persist synced fixture data across container restarts
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "healthcheck.py"]
      interval: 30m
      timeout: 10s
      retries: 3
      start_period: 10m
